name: App validation and Pages report

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'fixtures/**'
      - 'docs/**'
      - 'infra/cdk/**'
      - 'cdk.json'
      - '.github/workflows/**'
      - '.env.example'
      - 'README.md'
      - '*config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'fixtures/**'
      - 'docs/**'
      - 'infra/cdk/**'
      - 'cdk.json'
      - '.github/workflows/**'
      - '.env.example'
      - 'README.md'
      - '*config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        id: unit
        if: always() && steps.install.outcome == 'success'
        run: pnpm test
        continue-on-error: true

      - name: Lint
        id: lint
        if: always() && steps.install.outcome == 'success'
        run: pnpm lint
        continue-on-error: true

      - name: Frontend production build
        id: build
        if: always() && steps.install.outcome == 'success'
        run: pnpm build
        continue-on-error: true

      - name: CDK synthesis
        id: cdk
        if: always() && steps.install.outcome == 'success'
        run: pnpm cdk:synth
        continue-on-error: true

      - name: Install Playwright browser
        id: browser
        if: always() && steps.install.outcome == 'success'
        run: pnpm exec playwright install --with-deps chromium
        continue-on-error: true

      - name: Setup Ollama
        id: ollama-setup
        if: always() && steps.install.outcome == 'success'
        uses: ai-action/setup-ollama@v2
        env:
          OLLAMA_CONTEXT_LENGTH: 8192
        continue-on-error: true

      - name: Pull Gemma 3 4B
        id: ollama-pull
        if: always() && steps.ollama-setup.outcome == 'success'
        env:
          OLLAMA_MODEL: gemma3:4b
        run: ollama pull "$OLLAMA_MODEL"
        continue-on-error: true

      - name: End-to-end tests
        id: e2e
        if: always() && steps.install.outcome == 'success' && steps.browser.outcome == 'success' && steps.ollama-pull.outcome == 'success'
        env:
          LLM_PROVIDER: ollama
          OLLAMA_MODEL: gemma3:4b
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          OLLAMA_TIMEOUT_MS: 120000
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/dev-local.log"
          pnpm dev:local >"$log_file" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            docker rm -f ai-manufacturing-poc-emulator >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 180); do
            ui_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:5173/ || true)
            api_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/knowledge || true)
            if [[ "$ui_status" == "200" && "$api_status" == "401" ]]; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [[ "$ready" != "true" ]]; then
            tail -n 100 "$log_file"
            echo "::error::The local app and AWS Emulator did not become ready."
            exit 1
          fi

          if ! pnpm test:e2e:ollama; then
            tail -n 120 "$log_file"
            exit 1
          fi
        continue-on-error: true

      - name: Build Pages report
        if: always()
        env:
          UNIT_STATUS: ${{ steps.unit.outcome || 'skipped' }}
          LINT_STATUS: ${{ steps.lint.outcome || 'skipped' }}
          BUILD_STATUS: ${{ steps.build.outcome || 'skipped' }}
          CDK_STATUS: ${{ steps.cdk.outcome || 'skipped' }}
          E2E_STATUS: ${{ steps.e2e.outcome || 'skipped' }}
          OLLAMA_STATUS: ${{ steps.e2e.outcome || 'skipped' }}
        run: node scripts/build-pages-report.js

      - name: Upload report artifact
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-validation-report
          path: pages-site/
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow if any check failed
        if: always()
        env:
          INSTALL_STATUS: ${{ steps.install.outcome || 'skipped' }}
          UNIT_STATUS: ${{ steps.unit.outcome || 'skipped' }}
          LINT_STATUS: ${{ steps.lint.outcome || 'skipped' }}
          BUILD_STATUS: ${{ steps.build.outcome || 'skipped' }}
          CDK_STATUS: ${{ steps.cdk.outcome || 'skipped' }}
          BROWSER_STATUS: ${{ steps.browser.outcome || 'skipped' }}
          E2E_STATUS: ${{ steps.e2e.outcome || 'skipped' }}
          OLLAMA_SETUP_STATUS: ${{ steps.ollama-setup.outcome || 'skipped' }}
          OLLAMA_PULL_STATUS: ${{ steps.ollama-pull.outcome || 'skipped' }}
        run: |
          if [[ "$INSTALL_STATUS" != "success" || "$UNIT_STATUS" != "success" || "$LINT_STATUS" != "success" || "$BUILD_STATUS" != "success" || "$CDK_STATUS" != "success" || "$BROWSER_STATUS" != "success" || "$E2E_STATUS" != "success" || "$OLLAMA_SETUP_STATUS" != "success" || "$OLLAMA_PULL_STATUS" != "success" ]]; then
            echo "::error::One or more validation checks failed."
            exit 1
          fi

  publish:
    needs: verify
    if: always() && needs.verify.outputs.report-artifact-id != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download validation report
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify.outputs.report-artifact-id }}
          path: pages-site
          merge-multiple: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write report URL
        run: |
          echo "Validation report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
