name: App validation and Pages report

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'fixtures/**'
      - 'docs/**'
      - '.github/workflows/**'
      - '.env.example'
      - 'README.md'
      - '*config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'fixtures/**'
      - 'docs/**'
      - '.github/workflows/**'
      - '.env.example'
      - 'README.md'
      - '*config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        id: unit
        if: always() && steps.install.outcome == 'success'
        run: pnpm test
        continue-on-error: true

      - name: Lint
        id: lint
        if: always() && steps.install.outcome == 'success'
        run: pnpm lint
        continue-on-error: true

      - name: Install Playwright browser
        id: browser
        if: always() && steps.install.outcome == 'success'
        run: pnpm exec playwright install --with-deps chromium
        continue-on-error: true

      - name: End-to-end tests
        id: e2e
        if: always() && steps.install.outcome == 'success' && steps.browser.outcome == 'success'
        run: pnpm test:e2e
        continue-on-error: true

      - name: Build Pages report
        if: always()
        env:
          UNIT_STATUS: ${{ steps.unit.outcome || 'skipped' }}
          LINT_STATUS: ${{ steps.lint.outcome || 'skipped' }}
          E2E_STATUS: ${{ steps.e2e.outcome || 'skipped' }}
        run: node scripts/build-pages-report.js

      - name: Upload report artifact
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-validation-report
          path: pages-site/
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow if any check failed
        if: always()
        env:
          INSTALL_STATUS: ${{ steps.install.outcome || 'skipped' }}
          UNIT_STATUS: ${{ steps.unit.outcome || 'skipped' }}
          LINT_STATUS: ${{ steps.lint.outcome || 'skipped' }}
          BROWSER_STATUS: ${{ steps.browser.outcome || 'skipped' }}
          E2E_STATUS: ${{ steps.e2e.outcome || 'skipped' }}
        run: |
          if [[ "$INSTALL_STATUS" != "success" || "$UNIT_STATUS" != "success" || "$LINT_STATUS" != "success" || "$BROWSER_STATUS" != "success" || "$E2E_STATUS" != "success" ]]; then
            echo "::error::One or more validation checks failed."
            exit 1
          fi

  publish:
    needs: verify
    if: always() && needs.verify.outputs.report-artifact-id != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download validation report
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.report-artifact-id }}
          path: pages-site
          merge-multiple: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write report URL
        run: |
          echo "Validation report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
